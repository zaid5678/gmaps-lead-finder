name: Clinic Lead Scraper

on:
  workflow_dispatch: {}   # triggered once manually, then self-triggers until done

jobs:
  scrape-clinics:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    permissions:
      contents: write
      actions: write   # needed to trigger next run via API

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install playwright python-dotenv requests dnspython

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Check progress
        id: check_done
        run: |
          TOTAL=750
          if [ -f output/clinic_leads.done ]; then
            DONE=$(wc -l < output/clinic_leads.done | tr -d ' ')
          else
            DONE=0
          fi
          echo "done_count=$DONE" >> $GITHUB_OUTPUT
          if [ "$DONE" -ge "$TOTAL" ]; then
            echo "complete=true" >> $GITHUB_OUTPUT
            echo "All $TOTAL searches done — this is the final run."
          else
            echo "complete=false" >> $GITHUB_OUTPUT
            echo "$DONE / $TOTAL searches done so far."
          fi

      - name: Scrape clinics
        if: steps.check_done.outputs.complete != 'true'
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python clinic_scraper.py --max-searches 15

      - name: Commit progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f output/clinic_leads.csv ]  && git add output/clinic_leads.csv
          [ -f output/clinic_leads.done ] && git add output/clinic_leads.done
          git stash || true
          git pull --rebase origin main || true
          git stash pop || true
          [ -f output/clinic_leads.csv ]  && git add output/clinic_leads.csv
          [ -f output/clinic_leads.done ] && git add output/clinic_leads.done
          git diff --cached --quiet && echo "Nothing new to commit." || \
            git commit -m "chore: clinic leads — $(date '+%Y-%m-%d')"
          git push origin main || true

      - name: Trigger next batch (if not complete)
        # always() so this still fires even if the scrape step was killed by the job timeout
        if: always() && steps.check_done.outputs.complete != 'true'
        run: |
          # Re-read the actual current count from disk (post-commit) rather than assuming
          # a full batch completed — handles partial batches cut short by a timeout.
          if [ -f output/clinic_leads.done ]; then
            CURRENT=$(wc -l < output/clinic_leads.done | tr -d ' ')
          else
            CURRENT=0
          fi
          if [ "$CURRENT" -lt 750 ]; then
            echo "Queuing next batch ($CURRENT / 750 done so far)…"
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/clinic_scraper.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "Next run triggered."
          else
            echo "Final batch — no further runs needed."
          fi
