name: International Lead Scraper

on:
  schedule:
    # Mon = Ireland, Tue = Australia, Wed = Canada, Thu = USA  (06:00 UTC)
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 2'
    - cron: '0 6 * * 3'
    - cron: '0 6 * * 4'
  workflow_dispatch:
    inputs:
      country:
        description: 'Country to scrape (Ireland / Australia / Canada / USA)'
        required: false
        default: 'Ireland'

jobs:
  scrape-international:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 4-hour hard cap — commit/email steps use if: always()
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install playwright python-dotenv requests beautifulsoup4 lxml dnspython

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Determine country for today
        id: country
        run: |
          INPUT="${{ github.event.inputs.country }}"
          if [ -n "$INPUT" ]; then
            echo "country=$INPUT" >> $GITHUB_OUTPUT
          else
            DAY=$(date +%u)
            case $DAY in
              1) echo "country=Ireland"   >> $GITHUB_OUTPUT ;;
              2) echo "country=Australia" >> $GITHUB_OUTPUT ;;
              3) echo "country=Canada"    >> $GITHUB_OUTPUT ;;
              4) echo "country=USA"       >> $GITHUB_OUTPUT ;;
              *) echo "country=Ireland"   >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Scrape ${{ steps.country.outputs.country }}
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python international_scraper.py \
            --country "${{ steps.country.outputs.country }}" \
            --max-results 10 \
            --max-searches 30

      # Always commit progress, even if the scrape step failed or timed out
      - name: Commit updated leads CSV
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f output/international_leads.csv ]  && git add output/international_leads.csv
          [ -f output/international_leads.done ] && git add output/international_leads.done
          [ -f output/daily_send_count.json ] && git add output/daily_send_count.json
          git stash || true
          git pull --rebase origin main || true
          git stash pop || true
          [ -f output/international_leads.csv ]  && git add output/international_leads.csv
          [ -f output/international_leads.done ] && git add output/international_leads.done
          [ -f output/daily_send_count.json ] && git add output/daily_send_count.json
          git diff --cached --quiet && echo "Nothing new to commit." || \
            git commit -m "chore: international leads — ${{ steps.country.outputs.country }} $(date '+%Y-%m-%d')"
          git push origin main || true
